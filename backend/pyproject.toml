[project]
name = "metric-backend"
version = "0.13.0"
description = "Metric — API de suivi sportif personnel, stockage CSV sur Nextcloud"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  # httpx2 et non httpx : starlette 1.x déprécie httpx pour son TestClient, et le
  # client WebDAV (`L01-01`) doit parler la même bibliothèque que les tests.
  "httpx2>=2.9",
  "python-dateutil>=2.9",
  # Téléversement de photos de repas (`NUT-01`) : FastAPI en dépend pour le multipart.
  "python-multipart>=0.0.20",
  # Préparation des images avant envoi à un modèle vision (`IA-06`) : redimensionnement
  # et conversion JPEG. Côté serveur et non côté navigateur, parce qu'une photo **déjà
  # rangée** sur Nextcloud doit pouvoir être analysée elle aussi — un canvas ne la voit
  # jamais.
  "pillow>=11.0",
  # Chiffrement Web Push (`NOT-01`) : `aes128gcm` et l'échange ECDH de la RFC 8291. Le
  # projet évite les dépendances — CDP piloté sans Playwright, client WebDAV maison — et
  # cette économie ne s'applique pas ici : une erreur d'implémentation cryptographique ne
  # produit pas un bogue visible mais un chiffrement plus faible qu'annoncé.
  # Seul `WebPusher.encode` est appelé, qui ne fait aucune I/O ; l'envoi passe par httpx2
  # comme tout le reste, pour ne pas bloquer la boucle d'événements sur `requests`.
  "pywebpush>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ── Ruff ────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # bugbear
  "C4",       # comprehensions
  "SIM",      # simplify
  "RUF",      # ruff
  "ASYNC",    # pièges async
  "DTZ",      # datetime sans fuseau — critique pour HEAT-32
]
ignore = [
  "E501",  # longueur gérée par le formateur
]
# Le signe multiplié est la notation du backlog (« charge × séries × réps ») et le tiret
# demi-cadratin ponctue les commentaires français. Ce ne sont pas des coquilles.
# L'espace fine insécable (U+202F) est ce que produit le formatage français des
# nombres : on la retire des saisies à dessein, ce n'est pas une coquille.
allowed-confusables = ["×", "–", "’", "\u202f"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# ── Mypy ────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# `pywebpush` et `py_vapid` ne publient pas de `py.typed`. Les deux ne sont appelés que
# depuis `domains/notifications/push.py`, qui enveloppe leurs trois usages derrière une
# interface typée — la surface non vérifiée tient en trois lignes.
[[tool.mypy.overrides]]
module = ["pywebpush.*", "py_vapid.*"]
ignore_missing_imports = true

# ── Pytest ──────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
# La couche stockage est asynchrone de bout en bout : `async def test_…` sans décorateur.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
