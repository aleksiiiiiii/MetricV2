[project]
name = "metric-backend"
version = "0.1.0"
description = "Metric — API de suivi sportif personnel, stockage CSV sur Nextcloud"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  # httpx2 et non httpx : starlette 1.x déprécie httpx pour son TestClient, et le
  # client WebDAV (`L01-01`) doit parler la même bibliothèque que les tests.
  "httpx2>=2.9",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ── Ruff ────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # bugbear
  "C4",       # comprehensions
  "SIM",      # simplify
  "RUF",      # ruff
  "ASYNC",    # pièges async
  "DTZ",      # datetime sans fuseau — critique pour HEAT-32
]
ignore = [
  "E501",  # longueur gérée par le formateur
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# ── Mypy ────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ── Pytest ──────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
